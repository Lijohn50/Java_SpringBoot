<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Modern Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="glass-card">
            <h1 class="title">Get Started</h1>
            <p class="subtitle">Create your account to manage tasks</p>
            
            <form class="form" id="registerForm">
                <div class="input-group">
                    <input type="text" placeholder="Full Name" class="input" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email Address" class="input" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" class="input" required>
                </div>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" class="input" required>
                </div>
                <button type="submit" class="button">Create Account</button>
            </form>
            
            <p class="link-text">
                Already have an account? <a href="index.html" class="link">Sign in here</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
