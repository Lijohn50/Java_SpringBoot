<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Modern Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="glass-card">
            <h1 class="title">Welcome Back</h1>
            <p class="subtitle">Please enter your details to login</p>
            
            <form class="form" id="loginForm">
                <div class="input-group">
                    <input type="email" placeholder="Email Address" class="input" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" class="input" required>
                </div>
                <button type="submit" class="button">Login</button>
            </form>
            
            <p class="link-text">
                Don't have an account? <a href="register.html" class="link">Create account</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
